name: ocr_expense_tracker
description: Offline-first Flutter expense tracker with on-device receipt OCR, heuristic parsing, local SQLite persistence, receipt thumbnails, and CustomPainter analytics.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  image: ^4.10.1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
