name: Flutter CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
