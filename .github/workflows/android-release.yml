name: Android Release APK
on:
  push:
    branches: ["master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: Add optional ML Kit script dependencies required by R8
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            gradle_file="android/app/build.gradle.kts"
          elif [ -f android/app/build.gradle ]; then
            gradle_file="android/app/build.gradle"
          else
            echo "Could not find the generated Android app Gradle file."
            exit 1
          fi

          cat >> "$gradle_file" <<'EOF'

          // The Flutter ML Kit bridge references these optional script classes.
          // Include their libraries so R8 can resolve all references in release builds.
          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish APK as a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OCR Expense Tracker v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Android release for Mini-Project 3: OCR Expense Tracker.

            Includes on-device receipt OCR, heuristic receipt parsing, SQLite expense storage,
            receipt thumbnails, and CustomPainter spending charts.
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
